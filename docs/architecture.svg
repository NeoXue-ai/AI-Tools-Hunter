<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="530" viewBox="0 0 1150 530" role="img" aria-labelledby="arch-title arch-desc" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="arch-title">AI-Tools-Hunter Architecture</title>
  <desc id="arch-desc">CT-log driven discovery pipeline: CT Logs feed CT Ingest, which deduplicates via First-seen store, then a five-stage funnel (S1 Static, S2 RDAP, S3 DNS, S4 Probe, optional S5 LLM) classifies candidates into SQLite, served by FastAPI to the Review Console.</desc>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arr-emph" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- title -->
  <text x="24" y="42" font-size="17" font-weight="650" fill="#0f172a">AI-Tools-Hunter Architecture</text>
  <text x="24" y="62" font-size="11" fill="#64748b">CT-log driven discovery &#8594; five-stage funnel &#8594; review queue</text>

  <!-- region: Funnel -->
  <rect x="528" y="64" width="604" height="210" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="544" y="86" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">Funnel (S1&#8211;S5)</text>

  <!-- region: Storage & API -->
  <rect x="672" y="366" width="350" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="688" y="382" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">Storage &amp; API</text>

  <!-- edges: top pipeline -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M 136 230 H 180" marker-end="url(#arr)"/>
    <path d="M 314 230 H 358" marker-end="url(#arr)"/>
    <path d="M 492 230 H 536" marker-end="url(#arr)"/>
    <path d="M 640 230 H 684" marker-end="url(#arr)"/>
    <path d="M 806 230 H 850" marker-end="url(#arr)"/>
    <path d="M 948 230 H 992" marker-end="url(#arr)"/>
  </g>

  <!-- edges: funnel verticals -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M 1058 200 V 136" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <path d="M 1120 104 H 1136 V 416 H 1012" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <path d="M 1024 260 V 318 H 978 V 382" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-emph)"/>
  </g>

  <!-- edges: bottom row -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M 868 416 H 808" marker-end="url(#arr)"/>
    <path d="M 684 416 H 634" marker-end="url(#arr)"/>
  </g>

  <!-- nodes -->
  <g text-anchor="middle">
    <!-- CT Logs (external) -->
    <rect x="24" y="200" width="112" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="80" y="226" font-size="13" font-weight="600" fill="#0f172a">CT Logs</text>
    <text x="80" y="244" font-size="10" fill="#64748b">RFC 6962</text>

    <!-- CT Ingest (backend) -->
    <rect x="184" y="200" width="130" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="249" y="226" font-size="13" font-weight="600" fill="#0f172a">CT Ingest</text>
    <text x="249" y="244" font-size="10" fill="#64748b">adapter + runner</text>

    <!-- First-seen (database) -->
    <rect x="362" y="200" width="130" height="60" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="427" y="226" font-size="13" font-weight="600" fill="#0f172a">First-seen</text>
    <text x="427" y="244" font-size="10" fill="#64748b">ct_seen_domains</text>

    <!-- S1 (backend) -->
    <rect x="540" y="200" width="100" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="590" y="226" font-size="13" font-weight="600" fill="#0f172a">S1 Static</text>
    <text x="590" y="244" font-size="10" fill="#64748b">name shape</text>

    <!-- S2 (backend) -->
    <rect x="688" y="200" width="118" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="747" y="226" font-size="13" font-weight="600" fill="#0f172a">S2 RDAP</text>
    <text x="747" y="244" font-size="10" fill="#64748b">age &#8804;30d / &#8804;90d</text>

    <!-- S3 (backend) -->
    <rect x="854" y="200" width="94" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="901" y="226" font-size="13" font-weight="600" fill="#0f172a">S3 DNS</text>
    <text x="901" y="244" font-size="10" fill="#64748b">resolves?</text>

    <!-- S4 (backend) -->
    <rect x="996" y="200" width="124" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="1058" y="226" font-size="13" font-weight="600" fill="#0f172a">S4 Probe</text>
    <text x="1058" y="244" font-size="10" fill="#64748b">HTTP + SSRF guard</text>

    <!-- S5 (cloud) -->
    <rect x="996" y="76" width="124" height="56" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1058" y="100" font-size="13" font-weight="600" fill="#0f172a">S5 LLM</text>
    <text x="1058" y="117" font-size="10" fill="#64748b">optional classify</text>

    <!-- Review Console (frontend) -->
    <rect x="486" y="386" width="144" height="60" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="558" y="412" font-size="13" font-weight="600" fill="#0f172a">Review Console</text>
    <text x="558" y="430" font-size="10" fill="#64748b">Signal Desk</text>

    <!-- FastAPI (backend) -->
    <rect x="684" y="386" width="120" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="744" y="412" font-size="13" font-weight="600" fill="#0f172a">FastAPI</text>
    <text x="744" y="430" font-size="10" fill="#64748b">/v1 API</text>

    <!-- SQLite (database) -->
    <rect x="868" y="386" width="140" height="60" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="938" y="412" font-size="13" font-weight="600" fill="#0f172a">SQLite</text>
    <text x="938" y="430" font-size="10" fill="#64748b">append-only store</text>
  </g>

  <!-- edge labels (on top of nodes, white halo keeps them readable) -->
  <g font-size="10" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">
    <text x="158" y="222">entries</text>
    <text x="338" y="222">new domains</text>
    <text x="516" y="222">unseen</text>
    <text x="664" y="222">brand-like</text>
    <text x="830" y="222">&#8804;90d</text>
    <text x="972" y="222">resolves</text>
    <text x="1046" y="172" text-anchor="end">probe OK</text>
    <text x="1074" y="407">classified</text>
    <text x="990" y="360" text-anchor="start">candidate</text>
    <text x="838" y="407">review queue</text>
    <text x="659" y="407">JSON + UI</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#475569">
    <rect x="440" y="494" width="14" height="14" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="461" y="505">External</text>
    <rect x="540" y="494" width="14" height="14" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="561" y="505">Backend</text>
    <rect x="640" y="494" width="14" height="14" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="661" y="505">Database</text>
    <rect x="748" y="494" width="14" height="14" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="769" y="505">Cloud</text>
    <rect x="838" y="494" width="14" height="14" rx="4" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="859" y="505">Frontend</text>
  </g>
</svg>
