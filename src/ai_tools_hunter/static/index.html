    <script>
      // Resolve the palette before first paint so a dark-mode reload never
      // flashes white. Mirrors the key and fallback used in `useTheme`.
      (function () {
        try {
          var stored = localStorage.getItem("dh.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (error) {
          /* storage unavailable — light theme is a fine default */
        }
      })();
    </script>
